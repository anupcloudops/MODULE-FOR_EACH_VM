trigger:
- main

pool: asr


steps:
- task: PowerShell@2
  inputs:
    targetType: 'inline'
    script: 'pwd'

- task: TerraformTask@5
  inputs:
    provider: 'azurerm'
    command: 'init'
    workingDirectory: '$(System.DefaultWorkingDirectory)/_temp/3b21447e-4987-4e1f-b4d5-88dd2d59fa9c.ps1'
    backendAzureRmUseCliFlagsForAuthentication: true
    backendAzureRmUseIdTokenGeneration: true
    backendServiceArm: 'svc'
    backendAzureRmOverrideSubscriptionID: '05dbb74f-6152-4a1d-a1fd-c49be5c3fd99'
    backendAzureRmResourceGroupName: 'for-backend'
    backendAzureRmStorageAccountName: 'pipelinekeliye'
    backendAzureRmContainerName: 'pipestorage'
    backendAzureRmKey: 'devprod.tfstate'


