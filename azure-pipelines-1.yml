trigger: 
- main
- features/*

pool: asr

stages: 
 - stage: install_stage
   jobs:
     - job: terraform_install
       displayName: install
       steps:
       - task: TerraformInstaller@1
         inputs:
           terraformVersion: 'latest'
     - job: terraform_init
       displayName: init
       steps:
       - task: TerraformTask@5
         inputs:
           provider: 'azurerm'
           command: 'init'
           workingDirectory: '$(System.DefaultWorkingDirectory)/env/dev'
           backendServiceArm: 'svc'
           backendAzureRmResourceGroupName: 'for-backend'
           backendAzureRmStorageAccountName: 'pipelinekeliye'
           backendAzureRmContainerName: 'pipestorage'
           backendAzureRmKey: 'pttr.tfstate'
